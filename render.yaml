# Render Blueprint — deploys the whole site (backend + frontend) to one service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 1717-sports-arena
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm rebuild better-sqlite3
    startCommand: node backend/server.js
    healthCheckPath: /api/news
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://one717-sports-arena.onrender.com
