# Render Blueprint — deploys the whole site (backend + frontend) to one service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 1717-sports-arena
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/news
    envVars:
      # Postgres connection string (Neon, Supabase, or any hosted Postgres).
      # Set this secret in Render.
      - key: DATABASE_URL
        sync: false
      # Required in production — the server refuses to boot without it.
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Live Razorpay keys are set ONLY as Render secrets (Dashboard → Environment),
      # never in the repo. Test keys begin with rzp_test_, live keys with rzp_live_.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Same-origin deployments need no CORS config, but keep this accurate for
      # safety if the frontend is ever served from a different origin.
      - key: ALLOWED_ORIGINS
        value: https://www.1717sportsarena.com,https://1717sportsarena.com
