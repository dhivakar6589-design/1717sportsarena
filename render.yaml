# Render Blueprint — deploys the whole site (backend + frontend) to one service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 1717-sports-arena
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    # Deliberately no healthCheckPath. Render polls this path on a schedule and
    # that poll counts as traffic, which keeps the free instance awake 24/7 and
    # burns all 750 monthly instance hours. Without it the service sleeps after
    # ~15 idle minutes, which is the intended free-tier behaviour.
    envVars:
      # Postgres connection string (Neon, Supabase, or any hosted Postgres).
      # Set this secret in Render.
      - key: DATABASE_URL
        sync: false
      # Required in production — the server refuses to boot without it.
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Live Razorpay keys are set ONLY as Render secrets (Dashboard → Environment),
      # never in the repo. Test keys begin with rzp_test_, live keys with rzp_live_.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # Same-origin deployments need no CORS config, but keep this accurate for
      # safety if the frontend is ever served from a different origin.
      - key: ALLOWED_ORIGINS
        value: https://www.1717sportsarena.com,https://1717sportsarena.com
      # Cloudflare R2 bucket for news images. Free plan has 10GB and no egress
      # charges. Without these the service writes to its ephemeral disk and
      # every redeploy deletes uploaded posters.
      # Create at Cloudflare → R2 → Create bucket, then an R2 API token with
      # "Object Read & Write" on that bucket.
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
