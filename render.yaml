# Render Blueprint — deploys the whole site (backend + frontend) to one service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: 1717-sports-arena
    runtime: node
    plan: starter
    buildCommand: cd backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/news
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://1717-sports-arena.onrender.com
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
